<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Student Database · C++ front end</title>
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              bg: "var(--bg)",
              panel: "var(--panel)",
              line: "var(--line)",
              ink: "var(--ink)",
              mute: "var(--mute)",
            },
          },
        },
      };
    </script>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0d0f14;
        --panel: #141821;
        --line: #262c38;
        --ink: #e4e7ee;
        --mute: #8d95a6;
      }
      body {
        background: var(--bg);
        color: var(--ink);
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      const { useState, useRef, useEffect } = React;
      const html = htm.bind(React.createElement);

      const SORTS = [
        [1, "Roll"],
        [2, "Name"],
        [3, "Branch"],
        [4, "CGPA high to low"],
      ];
      const bytes = (s) => new TextEncoder().encode(s).length;
      const rollOf = (s) => {
        const n = Number(s);
        return s.trim() !== "" && Number.isInteger(n) && n >= 1 && n <= 999999
          ? n
          : null;
      };
      const api = (url, body) =>
        fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body || {}),
        }).then((r) => r.json());

      const inp =
        "w-full rounded-md bg-bg border border-line px-2.5 py-1.5 text-sm text-ink outline-none focus:border-sky-500 placeholder:text-mute";
      const btn =
        "rounded-md border border-line bg-bg px-3 py-1.5 text-sm text-ink transition-colors enabled:hover:border-sky-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-sky-500 disabled:cursor-not-allowed disabled:opacity-40";

      const Card = ({ title, children }) =>
        html`<section className="rounded-xl border border-line bg-panel p-4">
          <h2 className="mb-3 text-sm font-semibold text-ink">${title}</h2>
          ${children}
        </section>`;

      const Slot = ({ i, s, st }) => {
        const c =
          {
            new: "border-emerald-400 bg-emerald-400/10",
            shift: "border-amber-400 bg-amber-400/10",
            found: "border-emerald-400 bg-emerald-400/20",
          }[st] || "border-line bg-bg";
        return html`<div
          className=${`rounded-lg border p-2 min-h-[80px] transition-colors duration-300 ${s ? c : "border-dashed border-line"}`}
        >
          <div className="mono text-[11px] text-mute">[${i}]</div>
          ${s
            ? html`<div className="mono text-base font-semibold leading-tight">
                  ${s.roll}
                </div>
                <div className="truncate text-xs">${s.name}</div>
                <div className="text-[11px] text-mute">
                  ${s.branch} · ${s.cgpa.toFixed(2)}
                </div>`
            : html`<div className="mt-2 text-xs text-mute">empty</div>`}
        </div>`;
      };

      function App() {
        const [st, setSt] = useState({ records: [], size: 0, capacity: 4 });
        const [term, setTerm] = useState("");
        const [msg, setMsg] = useState(null);
        const [hl, setHl] = useState({});
        const [busy, setBusy] = useState(false);
        const [f, setF] = useState({
          roll: "",
          name: "",
          branch: "",
          cgpa: "",
        });
        const [key, setKey] = useState("");
        const termRef = useRef();

        useEffect(() => {
          const el = termRef.current;
          if (el) el.scrollTop = el.scrollHeight;
        }, [term]);
        const bad = (m) => setMsg({ t: "err", m });

        // Draw whatever the C++ program reported. Colours come from comparing the array before and after.
        const apply = (r, quiet) => {
          if (r.error) {
            bad("Server error: " + r.error);
            return;
          }
          if (r.state) {
            const h = {};
            if (!quiet) {
              const prev = new Map(st.records.map((x, i) => [x.roll, i]));
              r.state.records.forEach((x, i) => {
                if (!prev.has(x.roll)) h[i] = "new";
                else if (prev.get(x.roll) !== i) h[i] = "shift";
              });
              const m = /Found at index (\d+)/.exec(r.transcript);
              if (m) h[+m[1]] = "found";
            }
            setHl(h);
            setSt(r.state);
          }
          if (r.transcript) setTerm((t) => (t + r.transcript).slice(-20000));
          if (r.stuck)
            bad("The program is waiting at a prompt. Press Restart program.");
          else if (r.msg)
            setMsg({
              t: /error|not found|empty|invalid|already/i.test(r.msg)
                ? "err"
                : "ok",
              m: r.msg,
            });
        };
        const call = async (url, body, quiet) => {
          setBusy(true);
          try {
            const r = await api(url, body);
            apply(r, quiet);
            setBusy(false);
            return r;
          } catch (e) {
            bad("Cannot reach the server. Is node server.js running?");
            setBusy(false);
          }
        };
        const run = (lines) => call("/api/cmd", { lines });
        useEffect(() => {
          call("/api/cmd", { lines: [] }, true);
        }, []);
        const restart = async () => {
          setTerm("");
          setMsg(null);
          await call("/api/reset", {}, true);
        };

        const add = async () => {
          const roll = rollOf(f.roll),
            name = f.name.trim(),
            branch = f.branch.trim(),
            cgpa = Number(f.cgpa);
          if (roll === null)
            return bad("Roll must be an integer in [1, 999999].");
          if (!name || bytes(name) > 21)
            return bad("Name is required and can be at most 21 bytes.");
          if (!branch || bytes(branch) > 9)
            return bad("Branch is required and can be at most 9 bytes.");
          if (f.cgpa.trim() === "" || !(cgpa >= 0 && cgpa <= 10))
            return bad("CGPA must be a number in [0, 10].");
          const r = await run(["1", String(roll), name, branch, String(cgpa)]);
          if (r && /^Added/.test(r.msg))
            setF({ roll: "", name: "", branch: "", cgpa: "" });
        };
        const needRoll = () => {
          const r = rollOf(key);
          if (r === null) bad("Enter a roll number in [1, 999999].");
          return r;
        };
        const del = () => {
          const r = needRoll();
          if (r !== null) run(["2", String(r)]);
        };
        const find = (mode) => {
          const r = needRoll();
          if (r !== null) run(["3", String(mode), String(r)]);
        };

        const empty = st.size === 0;
        const field = (k, ph, mode) =>
          html`<input
            className=${inp}
            placeholder=${ph}
            inputmode=${mode}
            value=${f[k]}
            onChange=${(e) => setF({ ...f, [k]: e.target.value })}
            onKeyDown=${(e) => e.key === "Enter" && add()}
          />`;
        const stats = [
          ["Size", st.size],
          ["Capacity", st.capacity],
          ["Load", Math.round((st.size / st.capacity) * 100) + "%"],
        ];
        const LEG = [
          ["bg-emerald-400", "new or found"],
          ["bg-amber-400", "moved"],
        ];

        return html`<div className="mx-auto max-w-6xl space-y-5 px-4 py-6">
          <header className="flex flex-wrap items-start justify-between gap-3">
            <div>
              <h1 className="text-2xl font-semibold">Student Database</h1>
              <p className="mt-1 max-w-2xl text-sm text-mute">
                Every action runs in the compiled student_db.cpp program. This
                page only sends menu choices and draws what the program prints.
              </p>
            </div>
            <button className=${btn} disabled=${busy} onClick=${restart}>
              Restart program
            </button>
          </header>

          <div className="grid gap-5 lg:grid-cols-[300px_1fr]">
            <div className="space-y-4">
              <${Card} title="Add student">
                <div className="space-y-2">
                  ${field("roll", "Roll number (1 to 999999)", "numeric")}
                  ${field("name", "Name (up to 21 bytes)")}
                  ${field("branch", "Branch (up to 9 bytes)")}
                  ${field("cgpa", "CGPA (0 to 10)", "decimal")}
                  <button
                    className=${btn +
                    " w-full !border-transparent !bg-sky-700 enabled:hover:!bg-sky-600"}
                    disabled=${busy}
                    onClick=${add}
                  >
                    Add student
                  </button>
                  <p className="text-xs text-mute">
                    The page reads the C++ table by column, so longer names or
                    branches would break the layout.
                  </p>
                </div>
              <//>
              <${Card} title="Find or delete by roll">
                <input
                  className=${inp}
                  placeholder="Roll number"
                  inputmode="numeric"
                  value=${key}
                  onChange=${(e) => setKey(e.target.value)}
                />
                <div className="mt-2 grid grid-cols-2 gap-2">
                  <button
                    className=${btn}
                    disabled=${busy || empty}
                    onClick=${() => find(1)}
                  >
                    Linear search
                  </button>
                  <button
                    className=${btn}
                    disabled=${busy || empty}
                    onClick=${() => find(2)}
                  >
                    Binary search
                  </button>
                </div>
                <button
                  className=${btn +
                  " mt-2 w-full enabled:hover:!border-rose-500"}
                  disabled=${busy || empty}
                  onClick=${del}
                >
                  Delete record
                </button>
              <//>
              <${Card} title="Sort records">
                <div className="grid grid-cols-2 gap-2">
                  ${SORTS.map(
                    ([n, l]) =>
                      html`<button
                        key=${n}
                        className=${btn}
                        disabled=${busy || empty}
                        onClick=${() => run(["5", String(n)])}
                      >
                        ${l}
                      </button>`,
                  )}
                </div>
              <//>
              <${Card} title="Data">
                <div className="grid grid-cols-2 gap-2">
                  <button
                    className=${btn}
                    disabled=${busy}
                    onClick=${() => run(["7"])}
                  >
                    Load sample
                  </button>
                  <button
                    className=${btn + " enabled:hover:!border-rose-500"}
                    disabled=${busy}
                    onClick=${() => run(["4"])}
                  >
                    Clear all
                  </button>
                </div>
              <//>
            </div>

            <div className="min-w-0 space-y-4">
              ${msg &&
              html`<div
                className=${"mono rounded-lg border px-3 py-2 text-sm " +
                (msg.t === "err"
                  ? "border-rose-500/40 text-rose-300"
                  : "border-emerald-500/40 text-emerald-300")}
              >
                ${msg.m}
              </div>`}
              <div className="grid grid-cols-3 gap-3">
                ${stats.map(
                  ([l, v]) =>
                    html`<div
                      key=${l}
                      className="rounded-xl border border-line bg-panel px-4 py-3"
                    >
                      <div className="text-xs text-mute">${l}</div>
                      <div className="mono text-xl font-semibold">${v}</div>
                    </div>`,
                )}
              </div>

              <${Card}
                title=${`Memory block: ${st.capacity} slots, ${st.size} used`}
              >
                <div className="grid grid-cols-2 gap-2 sm:grid-cols-4">
                  ${Array.from(
                    { length: st.capacity },
                    (_, i) =>
                      html`<${Slot}
                        key=${i}
                        i=${i}
                        s=${st.records[i]}
                        st=${hl[i]}
                      />`,
                  )}
                </div>
                <div
                  className="mt-3 flex flex-wrap items-center gap-x-4 gap-y-1 text-xs text-mute"
                >
                  ${LEG.map(
                    ([c, t]) =>
                      html`<span key=${t} className="flex items-center gap-1.5"
                        ><span
                          className=${"inline-block h-2.5 w-2.5 rounded-sm " +
                          c}
                        ></span
                        >${t}</span
                      >`,
                  )}
                  <span>Colours show what the last command changed.</span>
                </div>
                <p className="mt-2 text-xs text-mute">
                  Grows to ${st.capacity * 2} when an insert arrives at size
                  ${st.capacity}.
                  ${st.capacity > 4
                    ? `Shrinks to ${Math.max(4, st.capacity / 2)} once size drops to ${Math.floor(st.capacity / 4)} or less.`
                    : "Already at the minimum capacity of 4."}
                </p>
              <//>

              <${Card} title="Program session (real stdin and stdout)">
                <pre
                  ref=${termRef}
                  className="mono max-h-72 overflow-auto whitespace-pre text-xs text-slate-300"
                >
${term || "Waiting for the program..."}</pre
                >
              <//>
            </div>
          </div>
        </div>`;
      }
      ReactDOM.createRoot(document.getElementById("root")).render(
        html`<${App} />`,
      );
    </script>
  </body>
</html>
