<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Student Database · C++ front end</title>
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script>
      tailwind.config = {
        future: { hoverOnlyWhenSupported: true },
        theme: {
          extend: {
            colors: {
              bg: "var(--bg)",
              panel: "var(--panel)",
              line: "var(--line)",
              ink: "var(--ink)",
              mute: "var(--mute)",
            },
          },
        },
      };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root {
        color-scheme: dark;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        background: #06050c;
        color: #e9e7f5;
        font-family: "Sora", ui-sans-serif, system-ui, sans-serif;
        overflow-x: hidden;
      }
      .mono {
        font-family:
          "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .aurora {
        position: fixed;
        inset: 0;
        z-index: -3;
        overflow: hidden;
      }
      .blob {
        position: absolute;
        border-radius: 9999px;
        filter: blur(100px);
        opacity: 0.45;
        animation: drift 20s ease-in-out infinite alternate;
      }
      .b1 {
        width: 48vw;
        height: 48vw;
        left: -12vw;
        top: -14vw;
        background: #6d28d9;
      }
      .b2 {
        width: 42vw;
        height: 42vw;
        right: -14vw;
        top: 8vh;
        background: #0e7490;
        animation-delay: -7s;
      }
      .b3 {
        width: 36vw;
        height: 36vw;
        left: 28vw;
        bottom: -20vw;
        background: #be185d;
        opacity: 0.3;
        animation-delay: -13s;
      }
      @keyframes drift {
        to {
          transform: translate3d(7vw, 6vh, 0) scale(1.18);
        }
      }
      .grid-bg {
        position: fixed;
        inset: 0;
        z-index: -2;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.045) 1px, transparent 1px),
          linear-gradient(
            90deg,
            rgba(255, 255, 255, 0.045) 1px,
            transparent 1px
          );
        background-size: 46px 46px;
        -webkit-mask-image: radial-gradient(
          ellipse at 50% 15%,
          #000 25%,
          transparent 75%
        );
        mask-image: radial-gradient(
          ellipse at 50% 15%,
          #000 25%,
          transparent 75%
        );
      }
      .glow {
        position: fixed;
        left: 0;
        top: 0;
        width: 460px;
        height: 460px;
        margin: -230px 0 0 -230px;
        border-radius: 9999px;
        pointer-events: none;
        z-index: -1;
        background: radial-gradient(
          circle,
          rgba(139, 92, 246, 0.2),
          transparent 65%
        );
      }
      .glass {
        position: relative;
        background: linear-gradient(
          145deg,
          rgba(255, 255, 255, 0.075),
          rgba(255, 255, 255, 0.02)
        );
        -webkit-backdrop-filter: blur(18px);
        backdrop-filter: blur(18px);
        border: 1px solid rgba(255, 255, 255, 0.09);
        box-shadow:
          0 24px 60px -28px rgba(0, 0, 0, 0.9),
          inset 0 1px 0 rgba(255, 255, 255, 0.07);
      }
      .glass::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.35s;
        background: radial-gradient(
          280px circle at var(--mx, 50%) var(--my, 50%),
          rgba(167, 139, 250, 0.17),
          transparent 70%
        );
      }
      .glass:hover::before {
        opacity: 1;
      }
      .grad {
        background: linear-gradient(90deg, #a78bfa, #22d3ee, #f472b6, #a78bfa);
        background-size: 300% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        animation: shine 9s linear infinite;
      }
      @keyframes shine {
        to {
          background-position: 300% 0;
        }
      }
      @keyframes pop {
        from {
          opacity: 0;
          transform: translateY(-8px) scale(0.98);
        }
      }
      .pop {
        animation: pop 0.4s cubic-bezier(0.2, 0.9, 0.3, 1.2);
      }
      @keyframes beat {
        0%,
        100% {
          transform: scale(1);
        }
        15% {
          transform: scale(1.3);
        }
        30% {
          transform: scale(1);
        }
        45% {
          transform: scale(1.2);
        }
      }
      .beat {
        display: inline-block;
        animation: beat 1.8s ease-in-out infinite;
      }
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-thumb {
        background: #2c2750;
        border-radius: 9px;
      }
      .tap {
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
      }
      .tap:enabled:active {
        transform: scale(0.96);
        filter: brightness(1.15);
        background-color: rgba(139, 92, 246, 0.24) !important;
        border-color: rgba(167, 139, 250, 0.85) !important;
        box-shadow:
          0 0 0 3px rgba(139, 92, 246, 0.25),
          0 10px 26px -8px rgba(139, 92, 246, 0.85) !important;
        transition-duration: 0.08s;
      }
      .danger {
        position: relative;
        overflow: hidden;
        isolation: isolate;
      }
      .danger::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: -1;
        background: linear-gradient(135deg, #ef4444, #be123c 55%, #f97316);
        opacity: 0;
        transition: opacity 0.3s ease;
      }
      .danger:enabled:active {
        background-color: transparent !important;
        border-color: transparent !important;
        color: #fff;
        box-shadow:
          0 0 0 3px rgba(239, 68, 68, 0.3),
          0 12px 30px -8px rgba(239, 68, 68, 0.9) !important;
      }
      .danger:enabled:active::before {
        opacity: 1;
      }
      @media (hover: hover) {
        .danger:enabled:hover {
          border-color: transparent !important;
          color: #fff;
          box-shadow: 0 12px 32px -10px rgba(239, 68, 68, 0.85) !important;
        }
        .danger:enabled:hover::before {
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="student_db.js"></script>
  </head>
  <body>
    <div class="aurora">
      <i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i>
    </div>
    <div class="grid-bg"></div>
    <div class="glow"></div>
    <div id="root"></div>
    <script>
      const { useState, useRef, useEffect } = React;
      const html = htm.bind(React.createElement);

      const SORTS = [
        [1, "Roll"],
        [2, "Name"],
        [3, "Branch"],
        [4, "CGPA high to low"],
      ];
      const okText = (s, max) =>
        s && s.length <= max && /^[ -~]+$/.test(s) && !s.includes("Choice:");
      const rollOf = (s) => {
        const n = Number(s);
        return s.trim() !== "" && Number.isInteger(n) && n >= 1 && n <= 999999
          ? n
          : null;
      };
      const KEY = "student_db_history_v1",
        MENU = "\n=========== Student Database";
      const loadHist = () => {
        try {
          const h = JSON.parse(localStorage.getItem(KEY) || "[]");
          return Array.isArray(h) ? h : [];
        } catch (e) {
          return [];
        }
      };
      const saveHist = (h) => {
        try {
          localStorage.setItem(KEY, JSON.stringify(h));
        } catch (e) {}
      };
      const cut = (s) => {
        const i = s.lastIndexOf(MENU);
        return i < 0 ? s : s.slice(0, i);
      };

      // Runs student_db.cpp (compiled to WebAssembly). Its stdin is the text we feed it; its stdout comes back as lines.
      // The program prints "Choice: " before reading each menu command, so the text after the j-th "Choice: "
      // is what command j printed.
      async function play(cmds) {
        if (typeof StudentDB !== "function")
          throw new Error("student_db.js is missing. Run build.sh first.");
        const input = new TextEncoder().encode(
          cmds.flat().concat("6").join("\n") + "\n",
        );
        let i = 0;
        const out = [];
        await StudentDB({
          stdin: () => (i < input.length ? input[i++] : null),
          print: (s) => out.push(s),
          printErr: () => {},
        });
        return out.join("\n").split("Choice: ");
      }
      // Read the table printed by menu option 6 (Display all).
      function parse(o) {
        const records = [];
        for (const ln of o.split("\n")) {
          const roll = ln.slice(0, 8).trim();
          if (!/^\d+$/.test(roll) || ln.length < 41) continue;
          records.push({
            roll: +roll,
            name: ln.slice(8, 30).trim(),
            branch: ln.slice(30, 40).trim(),
            cgpa: parseFloat(ln.slice(40)),
          });
        }
        const m = /Records: (\d+)\s+Capacity: (\d+)/.exec(o);
        return { records, size: m ? +m[1] : 0, capacity: m ? +m[2] : 4 };
      }

      // Data validation rules for the Add student form. Each returns an error message, or "" when the value is fine.
      const RULES = {
        roll: (v, recs) => {
          v = v.trim();
          if (!v) return "Roll number is required.";
          if (!/^\d+$/.test(v)) return "Digits only.";
          const n = +v;
          if (n < 1 || n > 999999) return "Must be between 1 and 999999.";
          if (recs.some((r) => r.roll === n))
            return "Roll " + n + " already exists.";
          return "";
        },
        name: (v) => {
          v = v.trim();
          if (!v) return "Name is required.";
          if (v.length < 2) return "Use at least 2 characters.";
          if (v.length > 21) return "Up to 21 characters.";
          if (!/^[A-Za-z][A-Za-z .'-]*$/.test(v))
            return "Letters, spaces, . ' and - only.";
          return "";
        },
        branch: (v) => {
          v = v.trim();
          if (!v) return "Branch is required.";
          if (v.length > 9) return "Up to 9 characters.";
          if (!/^[A-Za-z][A-Za-z0-9&-]*$/.test(v))
            return "Letters, digits, & and - only (e.g. AIML).";
          return "";
        },
        cgpa: (v) => {
          v = v.trim();
          if (!v) return "CGPA is required.";
          if (!/^\d{1,2}(\.\d{1,2})?$/.test(v))
            return "Enter a number with up to 2 decimals.";
          if (+v < 0 || +v > 10) return "Must be between 0 and 10.";
          return "";
        },
      };

      const inp =
        "w-full rounded-xl border border-white/10 bg-white/5 px-3.5 py-2.5 text-sm text-white outline-none transition focus:border-violet-400/70 focus:bg-white/10 focus:shadow-[0_0_0_4px_rgba(139,92,246,.18)] placeholder:text-slate-500";
      const btn =
        "tap rounded-xl border border-white/10 bg-white/5 px-3.5 py-2.5 text-sm text-slate-100 transition-all duration-200 enabled:hover:-translate-y-0.5 enabled:hover:border-violet-400/60 enabled:hover:bg-white/10 enabled:hover:shadow-[0_10px_28px_-10px_rgba(139,92,246,.7)] enabled:active:scale-95 focus-visible:outline focus-visible:outline-2 focus-visible:outline-violet-400 disabled:cursor-not-allowed disabled:opacity-40";
      const primary =
        " w-full !border-transparent bg-gradient-to-r from-violet-600 via-fuchsia-500 to-cyan-500 font-semibold text-white enabled:hover:brightness-110";

      const spot = (e) => {
        const r = e.currentTarget.getBoundingClientRect();
        e.currentTarget.style.setProperty("--mx", e.clientX - r.left + "px");
        e.currentTarget.style.setProperty("--my", e.clientY - r.top + "px");
      };

      const Card = ({ title, children }) =>
        html`<section
          className="glass reveal rounded-2xl p-5"
          onMouseMove=${spot}
        >
          <h2
            className="mb-4 flex items-center gap-2 text-sm font-semibold text-white"
          >
            <span
              className="h-1.5 w-1.5 rounded-full bg-gradient-to-r from-violet-400 to-cyan-400 shadow-[0_0_10px_#a78bfa]"
            ></span>
            ${title}
          </h2>
          ${children}
        </section>`;

      const Stat = ({ label, value, suffix = "", bar }) => {
        const ref = useRef(),
          prev = useRef(0);
        useEffect(() => {
          const o = { v: prev.current };
          prev.current = value;
          if (!window.gsap) {
            if (ref.current) ref.current.textContent = value + suffix;
            return;
          }
          const t = gsap.to(o, {
            v: value,
            duration: 0.9,
            ease: "power3.out",
            onUpdate: () => {
              if (ref.current)
                ref.current.textContent = Math.round(o.v) + suffix;
            },
          });
          return () => t.kill();
        }, [value]);
        return html`<div
          className="glass reveal rounded-2xl px-4 py-3.5"
          onMouseMove=${spot}
        >
          <div className="text-xs text-slate-400">${label}</div>
          <div ref=${ref} className="mono grad text-3xl font-medium">
            0${suffix}
          </div>
          ${bar &&
          html`<div
            className="mt-2 h-1 overflow-hidden rounded-full bg-white/10"
          >
            <div
              className="h-full rounded-full bg-gradient-to-r from-violet-500 via-fuchsia-500 to-cyan-400 transition-[width] duration-700"
              style=${{ width: Math.min(value, 100) + "%" }}
            ></div>
          </div>`}
        </div>`;
      };

      const Slot = ({ i, s, st }) => {
        const ref = useRef();
        useEffect(() => {
          if (st && ref.current && window.gsap)
            gsap.fromTo(
              ref.current,
              { scale: 0.85, y: 10 },
              { scale: 1, y: 0, duration: 0.6, ease: "back.out(2.2)" },
            );
        }, [st, s && s.roll]);
        const c =
          {
            new: "border-emerald-400/70 bg-emerald-400/10 shadow-[0_0_26px_-6px_rgba(52,211,153,.65)]",
            shift:
              "border-amber-400/70 bg-amber-400/10 shadow-[0_0_26px_-6px_rgba(251,191,36,.55)]",
            found:
              "border-cyan-300 bg-cyan-400/15 shadow-[0_0_30px_-4px_rgba(34,211,238,.75)]",
          }[st] || "border-white/10 bg-white/[0.04]";
        return html`<div
          ref=${ref}
          className=${`min-h-[88px] rounded-xl border p-2.5 transition-colors duration-300 ${s ? c : "border-dashed border-white/10"}`}
        >
          <div className="mono text-[11px] text-slate-500">[${i}]</div>
          ${s
            ? html`<div
                  className="mono text-base font-medium leading-tight text-white"
                >
                  ${s.roll}
                </div>
                <div className="truncate text-xs text-slate-200">${s.name}</div>
                <div className="text-[11px] text-slate-400">
                  ${s.branch} · ${s.cgpa.toFixed(2)}
                </div>`
            : html`<div className="mt-2 text-xs text-slate-600">
                free slot
              </div>`}
        </div>`;
      };

      // One page-load sequence plus a cursor spotlight.
      function FX() {
        useEffect(() => {
          if (!window.gsap) return;
          gsap.from(".reveal", {
            y: 40,
            opacity: 0,
            duration: 1,
            ease: "power3.out",
            stagger: 0.09,
            clearProps: "transform,opacity",
          });
          const g = document.querySelector(".glow"),
            gx = gsap.quickTo(g, "x", { duration: 0.7, ease: "power3" }),
            gy = gsap.quickTo(g, "y", { duration: 0.7, ease: "power3" }),
            mv = (e) => {
              gx(e.clientX);
              gy(e.clientY);
            };
          window.addEventListener("pointermove", mv);
          return () => window.removeEventListener("pointermove", mv);
        }, []);
        return null;
      }

      const TEAM = [
        ["Virat", true, "BTECH/15037/25", "AI&ML 3rd Sem."],
        ["Subhadeep Roy", false, "BTECH/15096/25", "AI&ML 3rd Sem."],
        ["Pranjal Sharma", false, "BTECH/15063/25", "AI&ML 3rd Sem."],
        ["Sanidhya Singh", false, "BTECH/15062/25", "AI&ML 3rd Sem."],
      ];

      function Footer() {
        const [open, setOpen] = useState(false);
        const pr = useRef();
        useEffect(() => {
          if (!open) return;
          const onKey = (e) => e.key === "Escape" && setOpen(false);
          window.addEventListener("keydown", onKey);
          if (pr.current && window.gsap) {
            gsap.from(pr.current, {
              y: 18,
              opacity: 0,
              scale: 0.96,
              duration: 0.5,
              ease: "power3.out",
            });
            gsap.from(pr.current.querySelectorAll("li"), {
              x: -18,
              opacity: 0,
              duration: 0.45,
              stagger: 0.08,
              delay: 0.15,
              ease: "power2.out",
            });
          }
          return () => window.removeEventListener("keydown", onKey);
        }, [open]);

        return html`<footer
          className="reveal pb-4 pt-8 text-center text-sm text-slate-400"
        >
          <div
            className="mx-auto mb-6 h-px max-w-md bg-gradient-to-r from-transparent via-violet-400/60 to-transparent"
          ></div>
          <p>
            Made with <span className="beat">❤️</span> by${" "}
            <button
              className="grad font-semibold underline decoration-violet-400/60 decoration-dotted underline-offset-4 focus-visible:outline focus-visible:outline-2 focus-visible:outline-violet-400"
              aria-expanded=${open}
              aria-controls="team-panel"
              onClick=${() => setOpen(!open)}
            >
              Code Blooded
            </button>
          </p>
          ${open &&
          html`<div
            ref=${pr}
            id="team-panel"
            className="glass mx-auto mt-5 max-w-xl rounded-2xl p-4 text-left"
          >
            <div className="mb-2 flex items-center justify-between">
              <h2 className="text-sm font-semibold text-white">
                Team Code Blooded
              </h2>
              <button
                className="rounded-lg px-2 py-1 text-xs text-slate-400 transition hover:bg-white/10 hover:text-white focus-visible:outline focus-visible:outline-2 focus-visible:outline-violet-400"
                onClick=${() => setOpen(false)}
              >
                Close
              </button>
            </div>
            <ul className="divide-y divide-white/10">
              ${TEAM.map(
                ([name, leader, id, sem]) =>
                  html`<li key=${id} className="flex items-center gap-3 py-2.5">
                    <span
                      className="flex h-9 w-9 shrink-0 items-center justify-center rounded-full bg-gradient-to-br from-violet-500 to-cyan-500 text-sm font-semibold text-white"
                      >${name[0]}</span
                    >
                    <span className="min-w-0 flex-1">
                      <span className="block text-sm text-white">
                        ${name}
                        ${leader &&
                        html`<span
                          className="ml-2 rounded-full border border-fuchsia-400/50 bg-fuchsia-400/10 px-2 py-0.5 text-[11px] text-fuchsia-200"
                          >Leader</span
                        >`}
                      </span>
                      <span className="mono block text-xs text-slate-400"
                        >${id}</span
                      >
                    </span>
                    <span className="text-xs text-slate-400">${sem}</span>
                  </li>`,
              )}
            </ul>
          </div>`}
        </footer>`;
      }

      function App() {
        const [st, setSt] = useState({ records: [], size: 0, capacity: 4 });
        const [term, setTerm] = useState("");
        const [msg, setMsg] = useState(null);
        const [hl, setHl] = useState({});
        const [busy, setBusy] = useState(false);
        const [f, setF] = useState({
          roll: "",
          name: "",
          branch: "",
          cgpa: "",
        });
        const [key, setKey] = useState("");
        const [touched, setTouched] = useState({});
        const formRef = useRef();
        const termRef = useRef();

        useEffect(() => {
          const el = termRef.current;
          if (el) el.scrollTop = el.scrollHeight;
        }, [term]);
        const bad = (m) => setMsg({ t: "err", m });

        // Draw whatever the C++ program reported. Colours come from comparing the array before and after.
        const apply = (r, quiet) => {
          if (r.error) {
            bad("Server error: " + r.error);
            return;
          }
          if (r.state) {
            const h = {};
            if (!quiet) {
              const prev = new Map(st.records.map((x, i) => [x.roll, i]));
              r.state.records.forEach((x, i) => {
                if (!prev.has(x.roll)) h[i] = "new";
                else if (prev.get(x.roll) !== i) h[i] = "shift";
              });
              const m = /Found at index (\d+)/.exec(r.transcript);
              if (m) h[+m[1]] = "found";
            }
            setHl(h);
            setSt(r.state);
          }
          if (r.transcript) setTerm((t) => (t + r.transcript).slice(-20000));
          if (r.stuck)
            bad("The program is waiting at a prompt. Press Restart program.");
          else if (r.msg)
            setMsg({
              t: /error|not found|empty|invalid|already/i.test(r.msg)
                ? "err"
                : "ok",
              m: r.msg,
            });
        };
        const hist = useRef(loadHist());
        // Replay every command so far in a fresh copy of the program, then run the new one plus a Display all.
        const exec = async (lines) => {
          const cmds = lines.length ? [...hist.current, lines] : hist.current,
            n = cmds.length;
          const parts = await play(cmds);
          if (parts.length < n + 2)
            throw new Error("the program stopped early");
          const result = lines.length ? cut(parts[n]).trim() : "";
          if (lines.length) {
            hist.current = cmds;
            saveHist(cmds);
          }
          return {
            state: parse(cut(parts[n + 1])),
            msg:
              result
                .split("\n")
                .map((s) => s.trim())
                .filter(Boolean)
                .pop() || "",
            transcript: lines.length
              ? "> " + lines.join("  ⏎  ") + "\n" + result + "\n\n"
              : "",
          };
        };
        const call = async (fn, quiet) => {
          setBusy(true);
          try {
            const r = await fn();
            apply(r, quiet);
            setBusy(false);
            return r;
          } catch (e) {
            bad("Could not run the program: " + e.message);
            setBusy(false);
          }
        };
        const run = (lines) => call(() => exec(lines));
        useEffect(() => {
          call(() => exec([]), true);
        }, []);
        const restart = async () => {
          hist.current = [];
          saveHist([]);
          setTerm("");
          setMsg(null);
          await call(() => exec([]), true);
        };

        // Success or failure animation on the Add student card (glow + badge, plus a shake on failure).
        const fire = (ok) => {
          const w = formRef.current;
          if (!w || !window.gsap) return;
          const glow = ok ? "rgba(52,211,153,.6)" : "rgba(244,63,94,.6)",
            badge = w.querySelector(ok ? ".fx-ok" : ".fx-err");
          gsap.killTweensOf([w, badge]);
          gsap
            .timeline({
              onComplete: () =>
                gsap.set(w, { clearProps: "boxShadow,transform" }),
            })
            .fromTo(
              w,
              { boxShadow: `0 0 0 0 ${glow}` },
              {
                boxShadow: `0 0 46px 4px ${glow}`,
                duration: 0.3,
                yoyo: true,
                repeat: 1,
                ease: "power2.out",
              },
              0,
            )
            .fromTo(
              badge,
              { opacity: 0, scale: 0.2 },
              { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(2.5)" },
              0.05,
            )
            .to(
              badge,
              { opacity: 0, scale: 1.35, duration: 0.35, ease: "power2.in" },
              0.9,
            );
          if (ok)
            gsap.fromTo(
              w,
              { scale: 1 },
              {
                scale: 1.025,
                duration: 0.2,
                yoyo: true,
                repeat: 1,
                ease: "power2.out",
              },
            );
          else {
            const sh = gsap.timeline();
            [-10, 10, -8, 8, -4, 0].forEach((x) =>
              sh.to(w, { x, duration: 0.07, ease: "power1.inOut" }),
            );
          }
        };

        const add = async () => {
          const invalid = ["roll", "name", "branch", "cgpa"].filter((k) =>
            RULES[k](f[k], st.records),
          );
          setTouched({ roll: true, name: true, branch: true, cgpa: true });
          if (invalid.length) {
            bad("Fix the highlighted fields before adding.");
            return fire(false);
          }
          const roll = +f.roll,
            name = f.name.trim().replace(/\s+/g, " "),
            branch = f.branch.trim(),
            cgpa = Number(f.cgpa);
          const r = await run(["1", String(roll), name, branch, String(cgpa)]);
          // Success means the new roll is now in the table the program printed.
          const added = !!(
            r &&
            r.state &&
            r.state.records.some((x) => x.roll === roll)
          );
          if (added) {
            const note = /\[array (?:grew|shrank)[^\]]*\]/.exec(r.msg || "");
            setF({ roll: "", name: "", branch: "", cgpa: "" });
            setTouched({});
            setMsg({
              t: "ok",
              m: `Added ${name} (roll ${roll}).` + (note ? "  " + note[0] : ""),
            });
          } else if (r) {
            setMsg({
              t: "err",
              m: "Could not add this student. Check the values and try again.",
            });
          }
          fire(added);
        };
        const needRoll = () => {
          const r = rollOf(key);
          if (r === null) bad("Enter a roll number in [1, 999999].");
          return r;
        };
        const del = () => {
          const r = needRoll();
          if (r !== null) run(["2", String(r)]);
        };
        const find = (mode) => {
          const r = needRoll();
          if (r !== null) run(["3", String(mode), String(r)]);
        };

        const empty = st.size === 0;
        const keyErr =
          key !== "" && rollOf(key) === null
            ? "Roll must be between 1 and 999999."
            : "";
        const field = (k, ph, mode, max) => {
          const e = touched[k] ? RULES[k](f[k], st.records) : "",
            ok = touched[k] && !e;
          return html`<div>
            <input
              className=${inp +
              (e
                ? " !border-rose-500/70 !shadow-[0_0_0_4px_rgba(244,63,94,.15)]"
                : ok
                  ? " !border-emerald-400/50"
                  : "")}
              placeholder=${ph}
              inputmode=${mode}
              maxlength=${max}
              value=${f[k]}
              aria-invalid=${!!e}
              onChange=${(ev) =>
                setF({
                  ...f,
                  [k]:
                    k === "roll"
                      ? ev.target.value.replace(/\D/g, "").slice(0, 6)
                      : ev.target.value,
                })}
              onBlur=${() => setTouched((t) => ({ ...t, [k]: true }))}
              onKeyDown=${(ev) => ev.key === "Enter" && add()}
            />
            ${e && html`<p className="pop mt-1 text-xs text-rose-300">${e}</p>`}
          </div>`;
        };
        const stats = [
          ["Size", st.size],
          ["Capacity", st.capacity],
          ["Load", Math.round((st.size / st.capacity) * 100) + "%"],
        ];
        const LEG = [
          ["bg-emerald-400", "new or found"],
          ["bg-amber-400", "moved"],
        ];

        return html`<div
          className="mx-auto max-w-6xl space-y-6 px-4 py-10 sm:py-14"
        >
          <header
            className="reveal flex flex-wrap items-end justify-between gap-5"
          >
            <div>
              <span
                className="inline-flex items-center gap-2 rounded-full border border-white/10 bg-white/5 px-3 py-1 text-xs text-slate-300 backdrop-blur"
              >
                <span className="relative flex h-2 w-2">
                  <span
                    className="absolute inline-flex h-full w-full animate-ping rounded-full bg-emerald-400 opacity-70"
                  ></span>
                  <span
                    className="relative inline-flex h-2 w-2 rounded-full bg-emerald-400"
                  ></span>
                </span>
                C++ program running live in WebAssembly
              </span>
              <h1
                className="grad mt-5 pb-1 text-4xl font-bold tracking-tight sm:text-6xl"
              >
                Student Database
              </h1>
              <p
                className="mt-3 max-w-xl text-sm leading-relaxed text-slate-400"
              >
                Every button here sends a menu choice to student_db.cpp, and the
                page draws whatever the program prints. Nothing leaves your
                browser.
              </p>
            </div>
            <button className=${btn} disabled=${busy} onClick=${restart}>
              Reset database
            </button>
          </header>

          <div className="grid gap-5 lg:grid-cols-[320px_1fr]">
            <div className="space-y-5">
              <div ref=${formRef} className="relative rounded-2xl">
                <${Card} title="Add student">
                  <div className="space-y-2.5">
                    ${field("roll", "Roll number (1 to 999999)", "numeric", 6)}
                    ${field("name", "Name (up to 21 characters)", "text", 21)}
                    ${field("branch", "Branch (up to 9 characters)", "text", 9)}
                    ${field("cgpa", "CGPA (0 to 10, e.g. 8.75)", "decimal", 5)}
                    <button
                      className=${btn + primary}
                      disabled=${busy}
                      onClick=${add}
                    >
                      Add student
                    </button>
                    <p className="text-xs leading-relaxed text-slate-500">
                      Plain ASCII only. The page reads the C++ table by column,
                      so longer values would break the layout.
                    </p>
                  </div>
                <//>
                <div
                  className="pointer-events-none absolute inset-0 z-20 flex items-center justify-center"
                >
                  <div
                    className="fx-ok flex h-20 w-20 items-center justify-center rounded-full bg-gradient-to-br from-emerald-400 to-cyan-500 opacity-0 shadow-[0_0_44px_rgba(52,211,153,.7)]"
                  >
                    <svg
                      viewBox="0 0 24 24"
                      className="h-10 w-10"
                      fill="none"
                      stroke="white"
                      strokeWidth="3"
                      strokeLinecap="round"
                      strokeLinejoin="round"
                    >
                      <path d="M5 13l4 4L19 7" />
                    </svg>
                  </div>
                </div>
                <div
                  className="pointer-events-none absolute inset-0 z-20 flex items-center justify-center"
                >
                  <div
                    className="fx-err flex h-20 w-20 items-center justify-center rounded-full bg-gradient-to-br from-rose-500 to-orange-500 opacity-0 shadow-[0_0_44px_rgba(244,63,94,.7)]"
                  >
                    <svg
                      viewBox="0 0 24 24"
                      className="h-10 w-10"
                      fill="none"
                      stroke="white"
                      strokeWidth="3"
                      strokeLinecap="round"
                      strokeLinejoin="round"
                    >
                      <path d="M6 6l12 12M18 6L6 18" />
                    </svg>
                  </div>
                </div>
              </div>
              <${Card} title="Find or delete by roll">
                <input
                  className=${inp + (keyErr ? " !border-rose-500/70" : "")}
                  placeholder="Roll number"
                  inputmode="numeric"
                  maxlength="6"
                  value=${key}
                  onChange=${(e) =>
                    setKey(e.target.value.replace(/\D/g, "").slice(0, 6))}
                />
                ${keyErr &&
                html`<p className="pop mt-1 text-xs text-rose-300">
                  ${keyErr}
                </p>`}
                <div className="mt-2.5 grid grid-cols-2 gap-2">
                  <button
                    className=${btn}
                    disabled=${busy || empty}
                    onClick=${() => find(1)}
                  >
                    Linear search
                  </button>
                  <button
                    className=${btn}
                    disabled=${busy || empty}
                    onClick=${() => find(2)}
                  >
                    Binary search
                  </button>
                </div>
                <button
                  className=${btn +
                  " mt-2 w-full enabled:hover:!border-rose-500/70"}
                  disabled=${busy || empty}
                  onClick=${del}
                >
                  Delete record
                </button>
              <//>
              <${Card} title="Sort records">
                <div className="grid grid-cols-2 gap-2">
                  ${SORTS.map(
                    ([n, l]) =>
                      html`<button
                        key=${n}
                        className=${btn}
                        disabled=${busy || empty}
                        onClick=${() => run(["5", String(n)])}
                      >
                        ${l}
                      </button>`,
                  )}
                </div>
              <//>
              <${Card} title="Data">
                <div className="grid grid-cols-2 gap-2">
                  <button
                    className=${btn}
                    disabled=${busy}
                    onClick=${() => run(["7"])}
                  >
                    Load sample
                  </button>
                  <button
                    className=${btn + " danger"}
                    disabled=${busy}
                    onClick=${() => run(["4"])}
                  >
                    Clear all
                  </button>
                </div>
              <//>
            </div>

            <div className="min-w-0 space-y-5">
              ${msg &&
              html`<div
                key=${msg.t + msg.m}
                className=${"pop mono rounded-xl border px-4 py-2.5 text-sm backdrop-blur " +
                (msg.t === "err"
                  ? "border-rose-500/40 bg-rose-500/10 text-rose-200"
                  : "border-emerald-500/40 bg-emerald-500/10 text-emerald-200")}
              >
                ${msg.m}
              </div>`}
              <div className="grid grid-cols-3 gap-4">
                <${Stat} label="Records" value=${st.size} />
                <${Stat} label="Capacity" value=${st.capacity} />
                <${Stat}
                  label="Load"
                  value=${Math.round((st.size / st.capacity) * 100)}
                  suffix="%"
                  bar=${true}
                />
              </div>

              <${Card}
                title=${`Memory block: ${st.capacity} slots, ${st.size} used`}
              >
                <div className="grid grid-cols-2 gap-2.5 sm:grid-cols-4">
                  ${Array.from(
                    { length: st.capacity },
                    (_, i) =>
                      html`<${Slot}
                        key=${i}
                        i=${i}
                        s=${st.records[i]}
                        st=${hl[i]}
                      />`,
                  )}
                </div>
                <div
                  className="mt-4 flex flex-wrap items-center gap-x-4 gap-y-1 text-xs text-slate-400"
                >
                  <span className="flex items-center gap-1.5"
                    ><span
                      className="h-2.5 w-2.5 rounded-sm bg-emerald-400"
                    ></span
                    >new</span
                  >
                  <span className="flex items-center gap-1.5"
                    ><span
                      className="h-2.5 w-2.5 rounded-sm bg-amber-400"
                    ></span
                    >moved</span
                  >
                  <span className="flex items-center gap-1.5"
                    ><span className="h-2.5 w-2.5 rounded-sm bg-cyan-300"></span
                    >found</span
                  >
                  <span>Colours show what the last command changed.</span>
                </div>
                <p className="mt-2 text-xs leading-relaxed text-slate-500">
                  Grows to ${st.capacity * 2} when an insert arrives at size
                  ${st.capacity}.
                  ${st.capacity > 4
                    ? `Shrinks to ${Math.max(4, st.capacity / 2)} once size drops to ${Math.floor(st.capacity / 4)} or less.`
                    : "Already at the minimum capacity of 4."}
                </p>
              <//>

              <${Card}
                title="Program session: inputs sent, then what the program printed"
              >
                <pre
                  ref=${termRef}
                  className="mono max-h-72 overflow-auto whitespace-pre rounded-xl border border-white/10 bg-black/40 p-3.5 text-xs leading-relaxed text-emerald-200/90"
                >
${term || "Waiting for the program..."}</pre
                >
              <//>
            </div>
          </div>
          <${Footer} />
          <${FX} />
        </div>`;
      }
      ReactDOM.createRoot(document.getElementById("root")).render(
        html`<${App} />`,
      );
    </script>
  </body>
</html>
